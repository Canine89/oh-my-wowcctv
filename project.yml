name: OhMyWowCCTV
options:
  bundleIdPrefix: dev.canine89
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  OhMyWowCCTV:
    type: application
    platform: macOS
    sources:
      - path: Sources/OhMyWowCCTV
        excludes:
          - "*.entitlements"
      - path: Addon
        type: folder
        buildPhase: resources
    info:
      path: Sources/OhMyWowCCTV/Info.plist
      properties:
        CFBundleName: Oh My WoW CCTV
        CFBundleDisplayName: Oh My WoW CCTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 canine89"
    entitlements:
      path: Sources/OhMyWowCCTV/OhMyWowCCTV.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.canine89.OhMyWowCCTV
        PRODUCT_NAME: OhMyWowCCTV
    scheme:
      testTargets:
        - OhMyWowCCTVTests
  OhMyWowCCTVTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/OhMyWowCCTVTests
    dependencies:
      - target: OhMyWowCCTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.canine89.OhMyWowCCTVTests
        GENERATE_INFOPLIST_FILE: YES
